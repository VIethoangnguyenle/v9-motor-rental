name: v9-rental-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Tạo bucket VÀ user riêng cho apps/api. User đó là một phần của hạ tầng, không
  # phải bước thủ công: thiếu nó thì `apps/api` chết lúc khởi động (env `required`)
  # và người mới clone repo không có cách nào biết vì sao. Cùng lý lẽ với việc
  # bucket được tạo ở đây thay vì "nhớ tạo bằng tay".
  #
  # `|| true` sau mỗi lệnh admin: container này chạy lại mỗi lần `compose up`, và
  # `user add` trên user đã tồn tại thì exit khác 0 — không có nó thì lần khởi
  # động thứ hai trở đi báo lỗi dù mọi thứ đều đúng.
  minio-init:
    image: minio/mc:latest
    volumes:
      - ./scripts/api-minio-policy.json:/policies/api-minio-policy.json:ro
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_BUCKET_VEHICLES} &&
      mc mb --ignore-existing local/${MINIO_BUCKET_CHECKINS} &&
      mc admin user add local ${API_S3_KEY} ${API_S3_SECRET} 2>/dev/null || true &&
      mc admin policy create local v9-api-checkins /policies/api-minio-policy.json 2>/dev/null || true &&
      mc admin policy attach local v9-api-checkins --user ${API_S3_KEY} 2>/dev/null || true &&
      echo 'buckets + user api sẵn sàng'
      "

  # Chỉ dữ liệu gốc: danh mục xe, ảnh, bảng giá. KHÔNG làm vận hành (lịch,
  # thống kê, bàn giao thuộc apps/staff — xem docs/plans/2026-08-05-round2-directus-staff-design.md §3.1).
  # Kết nối Postgres bằng role directus_app: đọc/ghi dữ liệu ở public, KHÔNG
  # có DDL — chặn schema drift ở tầng database, không phải config Directus.
  # Xem packages/db/migrations/0001_service_roles.sql và §3.2 design doc.
  directus:
    image: directus/directus:11
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: directus_app
      DB_PASSWORD: ${DIRECTUS_DB_PASSWORD}
      DB_SEARCH_PATH: directus,public
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      WEBSOCKETS_ENABLED: "false"
      # Ảnh xe lưu vào MinIO, KHÔNG lưu trong container: không có dòng này thì
      # mọi file upload biến mất sau `docker compose down`.
      STORAGE_LOCATIONS: s3
      STORAGE_S3_DRIVER: s3
      STORAGE_S3_KEY: ${MINIO_ROOT_USER}
      STORAGE_S3_SECRET: ${MINIO_ROOT_PASSWORD}
      STORAGE_S3_BUCKET: ${MINIO_BUCKET_VEHICLES}
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_ENDPOINT: http://minio:9000
      # BẮT BUỘC với MinIO: driver S3 mặc định dựng URL kiểu bucket.host/key,
      # MinIO chỉ phục vụ host/bucket/key. Thiếu dòng này upload trả 403/404
      # với thông báo không nhắc gì tới path style.
      STORAGE_S3_FORCE_PATH_STYLE: "true"
    ports:
      - "${DIRECTUS_PORT}:8055"

  # Xác thực cho apps/staff (§4 docs/plans/2026-08-05-round2-directus-staff-design.md).
  # Core riêng, tự tạo bảng của nó — nối role supertokens_app: schema riêng
  # `supertokens`, KHÔNG có DDL lên `public`. Cùng luật với directus_app ở trên.
  # Xem packages/db/migrations/0001_service_roles.sql và §4.2 design doc.
  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_CONNECTION_URI: postgres://supertokens_app:${SUPERTOKENS_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRESQL_TABLE_SCHEMA: supertokens
      API_KEYS: ${SUPERTOKENS_API_KEY}
    ports:
      - "3567:3567"
    # Image ship curl thật (Debian bookworm), không có wget — kiểm bằng
    # `docker run --entrypoint sh ... -c "which curl wget"` trước khi viết dòng này.
    # /hello trả "Hello" khi core sống — proxy liveness thật, không phải TCP connect suông.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3567/hello"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  minio-data:
