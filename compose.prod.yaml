name: v9-rental-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Không publish port ra host — chỉ Caddy được expose 80/443 ra ngoài,
    # mọi service khác chỉ giao tiếp qua network nội bộ của compose.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_BUCKET_VEHICLES} &&
      mc mb --ignore-existing local/${MINIO_BUCKET_CHECKINS} &&
      echo 'buckets sẵn sàng'
      "

  # Chỉ dữ liệu gốc: danh mục xe, ảnh, bảng giá. KHÔNG làm vận hành (lịch,
  # thống kê, bàn giao thuộc apps/staff — xem docs/plans/2026-08-05-round2-directus-staff-design.md §3.1).
  # Kết nối Postgres bằng role directus_app: đọc/ghi dữ liệu ở public, KHÔNG
  # có DDL — chặn schema drift ở tầng database, không phải config Directus.
  # Xem packages/db/migrations/0001_service_roles.sql và §3.2 design doc.
  # Không publish port ra host — chỉ Caddy expose ra ngoài, route data.$ROOT_DOMAIN.
  directus:
    image: directus/directus:11
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: directus_app
      DB_PASSWORD: ${DIRECTUS_DB_PASSWORD}
      DB_SEARCH_PATH: directus,public
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      WEBSOCKETS_ENABLED: "false"
      PUBLIC_URL: https://data.${ROOT_DOMAIN}

  # Xác thực cho apps/staff (§4 docs/plans/2026-08-05-round2-directus-staff-design.md).
  # Nội bộ hoàn toàn — chỉ apps/api gọi tới, KHÔNG route Caddy, KHÔNG publish port.
  # Cùng luật role/schema riêng như dev, xem compose.yaml.
  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_CONNECTION_URI: postgres://supertokens_app:${SUPERTOKENS_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRESQL_TABLE_SCHEMA: supertokens
      API_KEYS: ${SUPERTOKENS_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3567/hello"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/viethoangnguyenle/v9-motor-rental-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      supertokens:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET_VEHICLES: ${MINIO_BUCKET_VEHICLES}
      MINIO_BUCKET_CHECKINS: ${MINIO_BUCKET_CHECKINS}
      API_PORT: "3001"
      API_DOMAIN: https://api.${ROOT_DOMAIN}
      STAFF_APP_URL: https://staff.${ROOT_DOMAIN}
      SUPERTOKENS_CONNECTION_URI: http://supertokens:3567
      SUPERTOKENS_API_KEY: ${SUPERTOKENS_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    image: ghcr.io/viethoangnguyenle/v9-motor-rental-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: https://api.${ROOT_DOMAIN}
      PORT: "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
      - directus
    ports:
      - "80:80"
      - "443:443"
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

# Migration story: image api chứa packages/db (schema + migrations) nhưng
# compose không tự chạy migration lúc boot — apply thủ công (hoặc từ CI/CD)
# sau khi stack lên bằng:
#   docker compose -f compose.prod.yaml exec api bun packages/db/scripts/migrate.ts
# Cố ý tách khỏi CMD của container api: chạy migration mỗi lần container
# restart/scale là nguy hiểm (race condition khi nhiều replica cùng migrate).

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
