<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>V9 Motor Rental — Nhân viên</title>
    <!--
      iOS KHÔNG đọc `icons` của web manifest cho biểu tượng màn hình chính — nó
      đọc đúng thẻ này. Thiếu nó, "Thêm vào MH chính" trên iPhone lấy một ẢNH
      CHỤP MÀN HÌNH của trang làm icon. Không có cảnh báo ở đâu cả, và chỉ lộ ra
      sau khi người dùng đã cài.

      ⛔ File đang trỏ tới vẫn là ô màu đặc (đo được: đúng 1 màu duy nhất trên cả
      192×192) — chờ logo thật của shop, xem `docs/ROADMAP.md`. Dây đã nối sẵn để
      ngày có asset chỉ phải thay file, không phải nhớ ra là còn thiếu thẻ này.
    -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!--
      Ba thẻ, và cả ba đều cần thiết:

      • Hai thẻ có `media` phục vụ trường hợp THEO HỆ ĐIỀU HÀNH — trình duyệt tự
        chọn, không cần script, nên chúng đúng ngay cả trước khi bundle tải.
      • Thẻ KHÔNG có `media` là thứ `applyChoice()` (src/lib/theme.ts) ghi đè khi
        người dùng ép theme bằng tay; `media` không diễn đạt được "người dùng đã
        chọn", chỉ diễn đạt được "hệ điều hành đang ở chế độ nào".

      ⚠️ Khi người dùng ép theme, `applyChoice()` ghi CẢ BA thẻ chứ không riêng
      thẻ cuối: trình duyệt chỉ dùng thẻ ĐẦU TIÊN có `media` khớp, nên máy sáng +
      ép tối mà chỉ sửa thẻ cuối thì thanh địa chỉ ở lại màu sáng. Lý lẽ đầy đủ ở
      `themeColorFor` (src/lib/theme.ts).

      Giá trị là sRGB của `--color-canvas` từng theme (src/index.css). Manifest
      trong `vite.config.ts` cũng chép tay `#f8fafc` — đổi canvas SÁNG thì phải
      đổi cả ba chỗ; `theme.test.ts` canh cho ba chỗ khớp nhau.
    -->
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a111a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" />
    <!--
      Chống nháy trắng. PHẢI là script ĐỒNG BỘ trong `<head>`, chạy trước khung
      hình đầu tiên. Đặt việc này trong React là muộn: người dùng thấy một nháy
      sáng mỗi lần mở app, và trên PWA khởi động lạnh thì rất rõ.

      Nó cũng lo luôn ba thẻ trên: `applyChoice()` chỉ chạy khi người dùng BẤM nút
      gạt, nên nếu để một mình nó thì mọi lần tải trang sau đó, thẻ meta lại quay
      về theo hệ điều hành trong khi app theo lựa chọn đã lưu — và trang đăng nhập
      thì không có nút gạt để mà bấm.

      Màu lấy từ chính hai thẻ media ở trên, KHÔNG viết lại hằng số: đây đã là chỗ
      thứ ba chép tay `--color-canvas` rồi.

      Chép tay khoá "v9-theme" vì script này chạy TRƯỚC khi bundle tải nên không
      import được. `theme.test.ts` là sợi dây giữ hai chỗ bằng nhau, và nó CHẠY
      đoạn dưới đây chứ không chỉ đọc.
    -->
    <script>
      try {
        var c = localStorage.getItem("v9-theme");
        if (c === "light" || c === "dark") {
          document.documentElement.setAttribute("data-theme", c);
          var src = document.querySelector('meta[name="theme-color"][media*="' + c + '"]');
          var all = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < all.length; i++) all[i].content = src.content;
        }
      } catch (e) {
        /* Safari riêng tư ném khi đọc localStorage — đi theo hệ điều hành */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
